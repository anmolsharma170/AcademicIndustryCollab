<div class="flex flex-col items-center justify-center rounded-xl border border-dashed border-slate-300 bg-white px-6 py-12 text-center">
    <div class="flex h-11 w-11 items-center justify-center rounded-full bg-slate-100 text-slate-500">
        <i data-lucide="{{ icon|default:'inbox' }}" class="h-5 w-5"></i>
    </div>
    <h3 class="mt-3 text-sm font-semibold text-slate-900">{{ title|default:"Nothing here yet" }}</h3>
    {% if description %}
        <p class="mt-1 max-w-sm text-xs text-slate-500">{{ description }}</p>
    {% endif %}
    {% if cta_url and cta_label %}
        <a
            href="{{ cta_url }}"
            class="mt-4 inline-flex items-center gap-1.5 rounded-lg bg-indigo-600 px-3.5 py-2 text-xs font-semibold text-white shadow-xs hover:bg-indigo-700 transition"
        >
            {{ cta_label }}
        </a>
    {% endif %}
</div>
