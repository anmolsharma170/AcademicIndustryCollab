<div>
    {% if field.label %}
        <label for="{{ field.id_for_label }}" class="mb-1.5 block text-xs font-medium text-slate-700">
            {{ field.label }}
            {% if field.field.required %}<span class="text-rose-500">*</span>{% endif %}
        </label>
    {% endif %}
    {{ field }}
    {% if field.help_text %}
        <p class="mt-1 text-[11px] text-slate-500">{{ field.help_text|safe }}</p>
    {% endif %}
    {% if field.errors %}
        <div class="mt-1 space-y-0.5">
            {% for error in field.errors %}
                <p class="text-xs font-medium text-rose-600">{{ error }}</p>
            {% endfor %}
        </div>
    {% endif %}
</div>
