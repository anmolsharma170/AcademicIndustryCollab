<div class="rounded-xl border border-slate-200 bg-white shadow-xs {{ extra_class|default:'' }}">
    {% if title %}
        <div class="flex items-center justify-between border-b border-slate-100 px-5 py-3.5">
            <div>
                <h3 class="text-sm font-semibold text-slate-900">{{ title }}</h3>
                {% if subtitle %}<p class="mt-0.5 text-xs text-slate-500">{{ subtitle }}</p>{% endif %}
            </div>
            {% if action_url and action_label %}
                <a href="{{ action_url }}" class="text-xs font-medium text-indigo-600 hover:text-indigo-700">
                    {{ action_label }} →
                </a>
            {% endif %}
        </div>
    {% endif %}
    <div class="p-5">
        {{ body }}
    </div>
</div>
