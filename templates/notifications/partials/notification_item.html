<div id="notif-item-{{ n.pk }}" class="rounded-lg border px-3 py-2 text-left transition {% if n.is_read %}border-slate-100 bg-white{% else %}border-indigo-100 bg-indigo-50/50{% endif %}">
    <div class="flex items-start justify-between gap-2">
        <a href="{{ n.target_url|default:'#' }}" class="text-xs font-semibold text-slate-900 hover:text-indigo-600">
            {{ n.title }}
        </a>
        {% if not n.is_read %}
            <button
                type="button"
                hx-post="{% url 'notifications:mark_read' n.pk %}"
                hx-target="#notif-item-{{ n.pk }}"
                hx-swap="outerHTML"
                class="shrink-0 text-[10px] font-medium text-indigo-600 hover:underline"
            >
                Mark read
            </button>
        {% endif %}
    </div>
    <p class="mt-0.5 text-[11px] text-slate-600">{{ n.message }}</p>
    <p class="mt-1 text-[10px] text-slate-400">{{ n.created_at|timesince }} ago</p>
</div>
