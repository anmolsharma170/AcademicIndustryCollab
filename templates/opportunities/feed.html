{% extends "base.html" %}
{% block title %}Opportunities — NexusBridge{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div>
            <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Recommended Opportunities</h1>
            <p class="text-sm text-slate-500">Ranked live by skill overlap, proficiency, and academic eligibility.</p>
        </div>
        <a href="{% url 'skills:manage' %}" class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 bg-white px-3.5 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition">
            <i data-lucide="sliders-horizontal" class="h-3.5 w-3.5"></i>
            Tune My Skills
        </a>
    </div>

    <!-- Live HTMX Search & Filter Bar -->
    <form
        hx-get="{% url 'opportunities:feed' %}"
        hx-target="#opportunity-feed-results"
        hx-trigger="submit, change, keyup delay:300ms from:input[name='q']"
        hx-push-url="true"
        class="grid grid-cols-1 gap-3 rounded-xl border border-slate-200 bg-white p-4 shadow-xs sm:grid-cols-2 lg:grid-cols-5"
    >
        <div class="lg:col-span-2 relative">
            <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
            <input
                type="search"
                name="q"
                value="{{ query }}"
                placeholder="Search title, company, location, or skill..."
                class="w-full rounded-lg border border-slate-200 bg-slate-50 py-2 pl-9 pr-3 text-xs text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
            >
        </div>
        <select name="type" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs text-slate-700 focus:border-indigo-500 focus:outline-none">
            <option value="">All Opportunity Types</option>
            {% for val, label in opportunity_types %}
                <option value="{{ val }}" {% if selected_type == val %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
        <select name="mode" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs text-slate-700 focus:border-indigo-500 focus:outline-none">
            <option value="">All Work Modes</option>
            {% for val, label in work_modes %}
                <option value="{{ val }}" {% if selected_mode == val %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
        <select name="min_match" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs text-slate-700 focus:border-indigo-500 focus:outline-none">
            <option value="">Any Match Score</option>
            <option value="50" {% if min_match == "50" %}selected{% endif %}>50%+ Match</option>
            <option value="75" {% if min_match == "75" %}selected{% endif %}>75%+ Strong Match</option>
            <option value="85" {% if min_match == "85" %}selected{% endif %}>85%+ Top Match</option>
        </select>
    </form>

    <div id="opportunity-feed-results">
        {% include "opportunities/partials/feed_list.html" %}
    </div>
</div>
{% endblock %}
