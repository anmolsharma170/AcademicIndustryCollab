<div id="student-verify-row-{{ student.pk }}" class="flex items-center justify-between gap-4 px-5 py-3.5">
    <div class="min-w-0">
        <div class="flex items-center gap-2">
            <a href="{% url 'profiles:student_detail' student.pk %}" class="truncate text-sm font-medium text-slate-900 hover:text-indigo-600">
                {{ student.user.full_name }}
            </a>
            {% if student.is_verified_by_university %}
                <span class="rounded-full border border-emerald-200 bg-emerald-50 px-2 py-0.5 text-[11px] font-medium text-emerald-700">Verified</span>
            {% else %}
                <span class="rounded-full border border-amber-200 bg-amber-50 px-2 py-0.5 text-[11px] font-medium text-amber-700">Pending</span>
            {% endif %}
        </div>
        <p class="mt-0.5 text-xs text-slate-500 tabular-nums">
            {{ student.department }} · Class of {{ student.graduation_year }} · CGPA {{ student.cgpa }}
        </p>
    </div>
    <button
        type="button"
        hx-post="{% url 'profiles:toggle_student_verify' student.pk %}"
        hx-target="#student-verify-row-{{ student.pk }}"
        hx-swap="outerHTML"
        class="shrink-0 rounded-lg border px-3 py-1.5 text-xs font-semibold transition {% if student.is_verified_by_university %}border-slate-200 bg-white text-slate-700 hover:bg-slate-50{% else %}border-indigo-600 bg-indigo-600 text-white hover:bg-indigo-700{% endif %}"
    >
        {% if student.is_verified_by_university %}Revoke{% else %}Verify Student{% endif %}
    </button>
</div>
